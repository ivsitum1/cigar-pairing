name: CI

on:
  # Bez filtera po grani — SVAKI push prolazi provjeru, uključujući master.
  # Ranije je `branches-ignore: [master]` značio da izravni pushevi na master
  # (24 od zadnjih 30 commita) ne prolaze ništa; tako je slomljen `tsc` oborio
  # deploy. Filter `branches: [master]` bio bi druga krajnost — feature grane
  # bi ostale nepokrivene dok se ne otvori PR, a PR otvoren preko API tokena
  # ne okida workflow, pa bi kod stigao do mergea neprovjeren.
  push:
  pull_request:
    branches: [master]
  # ručno pokretanje kad je run potreban bez novog commita
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tsc -b --noEmit
        working-directory: app
      - run: npm test
        working-directory: app
        env:
          # Exhaustive giftFinder matrix (~1920 combos); skipped in deploy.yml smoke.
          CI_EXHAUSTIVE_GIFTS: "1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Blokirajuci gateovi. `--check` varijante su citaci — ne pisu u
      # scripts/output/, pa ne prljaju radno stablo.
      - name: Vitola normalize + curated descriptions --check
        working-directory: app
        run: |
          python scripts/normalize-vitolas.py --check
          python scripts/apply-cigar-descriptions.py --check
          python scripts/derive-drink-brands.py --check
          python scripts/derive-drink-display-names.py --check
          python scripts/normalize-profile-axes.py --check
          python scripts/merge-cigarworld-aroma.py --check
          python scripts/apply-taste-reports.py --check
          python scripts/merge-leaf-details.py --check
      - name: HR availability reconcile logic
        working-directory: app
        run: python scripts/test_reconcile_hr.py
      - name: Shop stock ping helpers (parse + catalog apply)
        working-directory: app
        run: |
          python scripts/test_stock_parse.py
          python scripts/test_availability_catalog.py
      - name: Drink shop gap scan / merge / ingest helpers
        working-directory: app
        run: |
          python scripts/test_scan_drink_shop_gaps.py
          python scripts/test_merge_drink_shops_additive.py
          python scripts/test_ingest_staged_drink_shops.py
          python scripts/test_enrich_shop_ingest_stubs.py
      - name: Taxonomy line helpers (dimenzije / velika slova u imenu linije)
        working-directory: app
        run: python scripts/test_taxonomy_lib.py
      - name: Snaga i tijelo iz opisa (redoslijed uzoraka, dvije osi)
        working-directory: app
        run: python scripts/test_neptune_strength.py
      - name: Dojmovi iz prijave (izvlačenje bloka, prosjek više ocjenjivača)
        working-directory: app
        run: python scripts/test_taste_reports.py
      - name: RumRatings parser i spajanje imena (12 YO ≠ 15 YO)
        working-directory: app
        run: python scripts/test_rumratings.py
      - name: YouTube corpus (classify / match / enrichments)
        working-directory: app
        run: |
          python -m unittest discover -s scripts -p "test_youtube*.py" -q
          python -m unittest discover -s scripts -p "test_summarize*.py" -q
          python scripts/apply-youtube-rum-enrichment.py --check
          python scripts/apply-youtube-drink-enrichment.py --check
          python scripts/apply-youtube-cigar-enrichment.py --check
      - name: List i punjenje iz dućanskih redaka (kubansko sjeme ≠ kubanski duhan)
        working-directory: app
        run: python scripts/test_merge_leaf_details.py
      # Obrada slika treba Pillow; instalira se samo za ovaj korak, aplikacija
      # ga ne koristi (slike se obradjuju lokalno, u repo ulazi gotov WebP).
      - name: Ujednačavanje podloga na fotografijama proizvoda
        working-directory: app
        run: |
          pip install --quiet Pillow
          python scripts/test_product_image_lib.py
          python scripts/test_scoped_product_images.py

      # Slike se smiju samo dodavati. Gate pada kad broj zapisa sa slikom ili
      # broj obrađenih padne ispod baselinea — namjerno uklanjanje traži
      # `--update-baseline` u istom commitu.
      - name: Pokrivenost fotografijama ne smije pasti
        working-directory: app
        run: python scripts/report-image-gaps.py --check

      # apply-taxonomy --check je od sada BLOKIRAJUCI. Ranije je stajao ovdje uz
      # biljesku „ne konvergira ni na netaknutom masteru" — to vise ne stoji.
      # Uzrok nije bio backlog nego jedan zapis: linija „Clásica" (Flor de Selva).
      # Skripta sortira po golom `.lower()`, gdje je „á" iza svih ASCII slova, pa
      # „Clásica" ide IZA „Classic Fino"/„Classic Tempo"; u datoteci je stajala
      # ispred njih. Sortiranje je htjelo pomaknuti taj jedan zapis, `changed`
      # je vjecno bio true, a nijedan sadrzaj se nije mijenjao. Jedno pokretanje
      # pisaca to je slozilo i skripta sada konvergira iz prvog prolaza.
      - name: Taxonomy apply konvergira
        working-directory: app
        run: python scripts/apply-taxonomy.py --check --skip-normalize

      # Blokirajući — pada samo na NOVE rupa u taksonomiji (delta vs
      # scripts/data/taxonomy_known_violations.txt). Backlog kuriranja živi u
      # baselineu; osvježi ga namjerno s --update-baseline kad se namjerno
      # proširi katalog bez taksonomije, ili kad se rupa zatvore.
      - name: Taxonomy coverage (no new gaps)
        working-directory: app
        run: python scripts/taxonomy-audit.py --fail-on-new --check-only

      - name: Drink shop merge audit (informativno)
        working-directory: app
        continue-on-error: true
        run: python scripts/audit_drink_shops_preship.py --check

      - run: npm run build
        working-directory: app

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # paddleocr/torch su neobavezni i teški — servis ima stub put bez njih,
      # pa testovi pokrivaju logiku (path traversal, granica uploada, 400 vs
      # 500) bez njih. fastapi + multipart trebaju za HTTP razinu.
      - name: Install backend deps (bez teškog OCR stacka)
        run: pip install pillow "numpy<2" imagehash fastapi python-multipart httpx
      - name: Backend smoke tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
