name: CI

on:
  # master je namjerno UKLJUČEN: ranije je `branches-ignore: [master]` značio
  # da izravni pushevi (24 od zadnjih 30 commita) ne prolaze nikakvu provjeru.
  # Tako je slomljen `tsc` stigao na master i oborio deploy.
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tsc -b --noEmit
        working-directory: app
      - run: npm test
        working-directory: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Blokirajući gateovi — zeleni su i moraju takvi ostati.
      - name: Taxonomy audit + curated descriptions --check
        working-directory: app
        run: |
          python scripts/taxonomy-audit.py --fail-on-new --check-only
          python scripts/apply-cigar-descriptions.py --check
      - name: HR availability reconcile logic
        working-directory: app
        run: python scripts/test_reconcile_hr.py

      # NEBLOKIRAJUĆI: ova dva gatea prijavljuju nakupljeni drift u katalogu
      # (~239 line-mergeva, 77 duplikat-sumnji). Nisu pokvareni — traže
      # sadržajne odluke o spajanju linija, a automatsko spajanje bi moglo
      # progutati zapise koji nisu duplikati. Dok se drift ne razriješi ručno,
      # vrte se informativno da ostatak CI-ja može štititi master.
      # TODO: kad se očisti, vratiti u blokirajući korak iznad.
      - name: Catalog drift (informativno)
        working-directory: app
        continue-on-error: true
        run: |
          python scripts/apply-taxonomy.py --check --skip-normalize
          python scripts/normalize-vitolas.py --check

      - run: npm run build
        working-directory: app

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # paddleocr/torch su neobavezni i teški — servis ima stub put bez njih,
      # pa smoke testovi pokrivaju logiku (uklj. path-traversal čuvar) bez njih.
      - name: Install backend deps (bez teškog OCR stacka)
        run: pip install pillow "numpy<2" imagehash
      - name: Backend smoke tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
