name: CI

on:
  # Bez filtera po grani — SVAKI push prolazi provjeru, uključujući master.
  # Ranije je `branches-ignore: [master]` značio da izravni pushevi na master
  # (24 od zadnjih 30 commita) ne prolaze ništa; tako je slomljen `tsc` oborio
  # deploy. Filter `branches: [master]` bio bi druga krajnost — feature grane
  # bi ostale nepokrivene dok se ne otvori PR, a PR otvoren preko API tokena
  # ne okida workflow, pa bi kod stigao do mergea neprovjeren.
  push:
  pull_request:
    branches: [master]
  # ručno pokretanje kad je run potreban bez novog commita
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tsc -b --noEmit
        working-directory: app
      - run: npm test
        working-directory: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Svih pet gateova je zeleno i blokira. `--check` varijante su citaci —
      # ne pisu u scripts/output/, pa ne prljaju radno stablo.
      - name: Taxonomy + vitola normalize --check
        working-directory: app
        run: |
          python scripts/apply-taxonomy.py --check --skip-normalize
          python scripts/normalize-vitolas.py --check
          python scripts/taxonomy-audit.py --fail-on-new --check-only
      - name: Curated cigar descriptions --check
        working-directory: app
        run: python scripts/apply-cigar-descriptions.py --check
      - name: HR availability reconcile logic
        working-directory: app
        run: python scripts/test_reconcile_hr.py

      - run: npm run build
        working-directory: app

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # paddleocr/torch su neobavezni i teški — servis ima stub put bez njih,
      # pa testovi pokrivaju logiku (path traversal, granica uploada, 400 vs
      # 500) bez njih. fastapi + multipart trebaju za HTTP razinu.
      - name: Install backend deps (bez teškog OCR stacka)
        run: pip install pillow "numpy<2" imagehash fastapi python-multipart httpx
      - name: Backend smoke tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
