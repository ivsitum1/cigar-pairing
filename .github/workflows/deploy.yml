name: Deploy to GitHub Pages

# Objava ide preko `gh-pages` grane, NE preko `actions/deploy-pages`.
#
# Zašto: artifact-deploy varijanta traži job vezan uz `github-pages`
# environment, a takav job 2026-08-06 nije uspio dobiti runner ni u jednom od
# šest pokušaja — `runner_id: 0`, bez logova, otkazan točno nakon 15 minuta u
# redu čekanja. `build` job je na istom runu dobivao runner za 3 sekunde i
# prolazio u minuti, a environment nema nijedan protection rule (provjereno:
# bez required reviewers i wait timera, `master` dopušten). Dakle zapinjao je
# Pages/Deployments sloj, ne naš build.
#
# Ova varijanta gura gotov `app/dist` na granu običnim git pushom, pa Pages
# servira granu. Uvjet: Settings → Pages → Source = "Deploy from a branch",
# grana `gh-pages`, mapa `/ (root)`.
#
# Povratak na staro: `git revert` ovog commita + Source natrag na
# "GitHub Actions".
#
# Deploy se pokreće tek nakon uspješnog CI runa na `master` (workflow_run),
# ne paralelno s njim — Python `--check` gateovi moraju proći prije objave.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# NE zove se "pages": run 31126813954 zaglavio je u stanju iz kojeg ga GitHub
# ne da ni otkazati ("Cannot cancel a workflow re-run that has not yet queued")
# i drži tu grupu, pa novi runovi u njoj nisu ni nastajali — merge PR-a #143
# nije pokrenuo deploy. Vlastito ime grupe zaobilazi zombija.
concurrency:
  group: pages-branch-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app

      - name: Publish app/dist to gh-pages
        working-directory: app/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pages inače provuče izlaz kroz Jekyll i pojede mape s "_" prefiksom
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: ${GITHUB_SHA}"
          # grana je čisti snapshot builda, pa je force push namjeran
          git push -q -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
          echo "objavljeno na gh-pages: ${GITHUB_SHA}"
